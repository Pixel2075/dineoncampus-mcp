[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dineoncampus-mcp"
dynamic = ["version"]
description = "MCP server that gives Claude and other LLMs DineOnCampus dining hall menus, opening hours, nutrition facts and macros."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Syed Sibt E Hassan Kazmi" }]
keywords = ["mcp", "model-context-protocol", "dineoncampus", "dining", "nutrition", "macros", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "mcp>=2.3,<3",
    "requests>=2.31",
    "tzdata; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/Pixel2075/dineoncampus-mcp"
Issues = "https://github.com/Pixel2075/dineoncampus-mcp/issues"

[project.scripts]
dineoncampus-mcp = "dineoncampus_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.hatch.version]
path = "src/dineoncampus_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dineoncampus_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
